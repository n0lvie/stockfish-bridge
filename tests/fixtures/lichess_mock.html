<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline Mock Lichess Board</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #161512;
      font-family: sans-serif;
      color: #bababa;
    }
    .round__app {
      width: 800px;
      margin: 0 auto;
      user-select: none;
    }
    .rclock {
      background: #21201d;
      padding: 8px 16px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 4px;
      margin: 8px 0;
      display: inline-block;
      min-width: 120px;
      text-align: center;
      color: #999;
    }
    .rclock.running {
      background: #fff;
      color: #000;
    }
    .main-board {
      width: 800px;
      height: 800px;
      position: relative;
    }
    cg-wrap {
      width: 800px;
      height: 800px;
      display: block;
      position: relative;
    }
    cg-board {
      width: 800px;
      height: 800px;
      display: block;
      position: relative;
      background: #b58863;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    piece {
      width: 100px;
      height: 100px;
      position: absolute;
      top: 0;
      left: 0;
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: auto;
      cursor: pointer;
      display: block;
    }
  </style>
</head>
<body>
  <div class="round__app">
    <div class="rclock rclock-top" id="top-clock"><div class="time">03:00</div></div>

    <div class="main-board">
      <cg-wrap class="orientation-white" id="cg-wrap">
        <cg-board id="board">
          <!-- White pieces rank 1 (y: 700px) -->
          <piece class="white rook" cg-key="a1" style="transform: translate(0px, 700px);"></piece>
          <piece class="white knight" cg-key="b1" style="transform: translate(100px, 700px);"></piece>
          <piece class="white bishop" cg-key="c1" style="transform: translate(200px, 700px);"></piece>
          <piece class="white queen" cg-key="d1" style="transform: translate(300px, 700px);"></piece>
          <piece class="white king" cg-key="e1" style="transform: translate(400px, 700px);"></piece>
          <piece class="white bishop" cg-key="f1" style="transform: translate(500px, 700px);"></piece>
          <piece class="white knight" cg-key="g1" style="transform: translate(600px, 700px);"></piece>
          <piece class="white rook" cg-key="h1" style="transform: translate(700px, 700px);"></piece>

          <!-- White pawns rank 2 (y: 600px) -->
          <piece class="white pawn" cg-key="a2" style="transform: translate(0px, 600px);"></piece>
          <piece class="white pawn" cg-key="b2" style="transform: translate(100px, 600px);"></piece>
          <piece class="white pawn" cg-key="c2" style="transform: translate(200px, 600px);"></piece>
          <piece class="white pawn" cg-key="d2" style="transform: translate(300px, 600px);"></piece>
          <piece class="white pawn" cg-key="e2" style="transform: translate(400px, 600px);"></piece>
          <piece class="white pawn" cg-key="f2" style="transform: translate(500px, 600px);"></piece>
          <piece class="white pawn" cg-key="g2" style="transform: translate(600px, 600px);"></piece>
          <piece class="white pawn" cg-key="h2" style="transform: translate(700px, 600px);"></piece>

          <!-- Black pawns rank 7 (y: 100px) -->
          <piece class="black pawn" cg-key="a7" style="transform: translate(0px, 100px);"></piece>
          <piece class="black pawn" cg-key="b7" style="transform: translate(100px, 100px);"></piece>
          <piece class="black pawn" cg-key="c7" style="transform: translate(200px, 100px);"></piece>
          <piece class="black pawn" cg-key="d7" style="transform: translate(300px, 100px);"></piece>
          <piece class="black pawn" cg-key="e7" style="transform: translate(400px, 100px);"></piece>
          <piece class="black pawn" cg-key="f7" style="transform: translate(500px, 100px);"></piece>
          <piece class="black pawn" cg-key="g7" style="transform: translate(600px, 100px);"></piece>
          <piece class="black pawn" cg-key="h7" style="transform: translate(700px, 100px);"></piece>

          <!-- Black pieces rank 8 (y: 0px) -->
          <piece class="black rook" cg-key="a8" style="transform: translate(0px, 0px);"></piece>
          <piece class="black knight" cg-key="b8" style="transform: translate(100px, 0px);"></piece>
          <piece class="black bishop" cg-key="c8" style="transform: translate(200px, 0px);"></piece>
          <piece class="black queen" cg-key="d8" style="transform: translate(300px, 0px);"></piece>
          <piece class="black king" cg-key="e8" style="transform: translate(400px, 0px);"></piece>
          <piece class="black bishop" cg-key="f8" style="transform: translate(500px, 0px);"></piece>
          <piece class="black knight" cg-key="g8" style="transform: translate(600px, 0px);"></piece>
          <piece class="black rook" cg-key="h8" style="transform: translate(700px, 0px);"></piece>
        </cg-board>
      </cg-wrap>
    </div>

    <div class="rclock rclock-bottom running" id="bottom-clock"><div class="time">03:00</div></div>
  </div>

  <script>
    (function() {
      const board = document.getElementById('board');
      const cgWrap = document.getElementById('cg-wrap');
      let dragStart = null;

      // Sync cgKey property and attribute on all pieces
      function syncCgKeys() {
        const pieces = board.querySelectorAll('piece');
        pieces.forEach(p => {
          const key = p.getAttribute('cg-key') || p.cgKey;
          if (key) {
            p.cgKey = key;
            p.setAttribute('cg-key', key);
          }
        });
      }
      syncCgKeys();

      function getSquareFromCoords(x, y) {
        const rect = board.getBoundingClientRect();
        const sqSize = rect.width / 8;
        const isFlipped = cgWrap.classList.contains('orientation-black');

        let file = Math.floor((x - rect.left) / sqSize);
        let rankIdx = Math.floor((y - rect.top) / sqSize);

        if (file < 0 || file > 7 || rankIdx < 0 || rankIdx > 7) return null;

        let rank = isFlipped ? rankIdx : (7 - rankIdx);
        if (isFlipped) file = 7 - file;

        const fileChar = String.fromCharCode(97 + file);
        const rankNum = rank + 1;
        const squareKey = `${fileChar}${rankNum}`;

        return { file, rank, squareKey };
      }

      function handleMove(fromSquare, toSquare) {
        if (!fromSquare || !toSquare || fromSquare.squareKey === toSquare.squareKey) return;

        const pieces = board.querySelectorAll('piece');
        let movingPiece = null;
        for (const p of pieces) {
          if (p.getAttribute('cg-key') === fromSquare.squareKey || p.cgKey === fromSquare.squareKey) {
            movingPiece = p;
            break;
          }
        }

        if (!movingPiece) return;

        // Remove any piece at destination
        for (const p of pieces) {
          if (p !== movingPiece && (p.getAttribute('cg-key') === toSquare.squareKey || p.cgKey === toSquare.squareKey)) {
            p.remove();
          }
        }

        const rect = board.getBoundingClientRect();
        const sqSize = rect.width / 8;
        const isFlipped = cgWrap.classList.contains('orientation-black');

        let targetX = (isFlipped ? (7 - toSquare.file) : toSquare.file) * sqSize;
        let targetY = (isFlipped ? toSquare.rank : (7 - toSquare.rank)) * sqSize;

        movingPiece.style.transform = `translate(${targetX}px, ${targetY}px)`;
        movingPiece.setAttribute('cg-key', toSquare.squareKey);
        movingPiece.cgKey = toSquare.squareKey;

        // Switch active clock
        const topClock = document.getElementById('top-clock');
        const bottomClock = document.getElementById('bottom-clock');
        if (bottomClock.classList.contains('running')) {
          bottomClock.classList.remove('running');
          topClock.classList.add('running');
        } else {
          topClock.classList.remove('running');
          bottomClock.classList.add('running');
        }
      }

      board.addEventListener('pointerdown', (e) => {
        dragStart = getSquareFromCoords(e.clientX, e.clientY);
      });

      board.addEventListener('pointerup', (e) => {
        if (!dragStart) return;
        const dragEnd = getSquareFromCoords(e.clientX, e.clientY);
        if (dragEnd && dragStart.squareKey !== dragEnd.squareKey) {
          handleMove(dragStart, dragEnd);
        }
        dragStart = null;
      });

      board.addEventListener('mousedown', (e) => {
        if (!dragStart) dragStart = getSquareFromCoords(e.clientX, e.clientY);
      });

      board.addEventListener('mouseup', (e) => {
        if (!dragStart) return;
        const dragEnd = getSquareFromCoords(e.clientX, e.clientY);
        if (dragEnd && dragStart.squareKey !== dragEnd.squareKey) {
          handleMove(dragStart, dragEnd);
        }
        dragStart = null;
      });

      window.__mockLichess = {
        handleMove,
        syncCgKeys
      };
    })();
  </script>
</body>
</html>
