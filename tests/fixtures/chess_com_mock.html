<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline Mock Chess.com Board</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #312e2b;
      font-family: sans-serif;
      color: #fff;
    }
    .board-layout-component {
      width: 800px;
      margin: 0 auto;
      user-select: none;
    }
    .clock-component {
      background: #262421;
      padding: 8px 16px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 4px;
      margin: 8px 0;
      display: inline-block;
      min-width: 120px;
      text-align: center;
    }
    .clock-player-turn {
      background: #fff;
      color: #000;
    }
    wc-chess-board {
      width: 800px;
      height: 800px;
      display: block;
      position: relative;
      background: #b58863;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .piece {
      width: 100px;
      height: 100px;
      position: absolute;
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: auto;
      cursor: pointer;
    }
    /* Square positioning classes: square-xy where x is file (1-8), y is rank (1-8) */
    /* When not flipped: */
    /* square-11 is a1 (left: 0, top: 700px) */
  </style>
</head>
<body>
  <div class="board-layout-component">
    <div class="clock-component clock-top" id="top-clock"><span class="time">02:15</span></div>
    
    <wc-chess-board id="board">
      <!-- Starting White Pieces -->
      <div class="piece wr square-11 square-a1"></div>
      <div class="piece wn square-21 square-b1"></div>
      <div class="piece wb square-31 square-c1"></div>
      <div class="piece wq square-41 square-d1"></div>
      <div class="piece wk square-51 square-e1"></div>
      <div class="piece wb square-61 square-f1"></div>
      <div class="piece wn square-71 square-g1"></div>
      <div class="piece wr square-81 square-h1"></div>
      
      <div class="piece wp square-12 square-a2"></div>
      <div class="piece wp square-22 square-b2"></div>
      <div class="piece wp square-32 square-c2"></div>
      <div class="piece wp square-42 square-d2"></div>
      <div class="piece wp square-52 square-e2"></div>
      <div class="piece wp square-62 square-f2"></div>
      <div class="piece wp square-72 square-g2"></div>
      <div class="piece wp square-82 square-h2"></div>

      <!-- Starting Black Pieces -->
      <div class="piece bp square-17 square-a7"></div>
      <div class="piece bp square-27 square-b7"></div>
      <div class="piece bp square-37 square-c7"></div>
      <div class="piece bp square-47 square-d7"></div>
      <div class="piece bp square-57 square-e7"></div>
      <div class="piece bp square-67 square-f7"></div>
      <div class="piece bp square-77 square-g7"></div>
      <div class="piece bp square-87 square-h7"></div>

      <div class="piece br square-18 square-a8"></div>
      <div class="piece bn square-28 square-b8"></div>
      <div class="piece bb square-38 square-c8"></div>
      <div class="piece bq square-48 square-d8"></div>
      <div class="piece bk square-58 square-e8"></div>
      <div class="piece bb square-68 square-f8"></div>
      <div class="piece bn square-78 square-g8"></div>
      <div class="piece br square-88 square-h8"></div>
    </wc-chess-board>

    <div class="clock-component clock-bottom clock-player-turn" id="bottom-clock"><span class="time">01:30.5</span></div>
  </div>

  <script>
    (function() {
      const board = document.getElementById('board');
      let dragStart = null;

      function updatePiecePositions() {
        const rect = board.getBoundingClientRect();
        const sqSize = rect.width / 8;
        const isFlipped = board.classList.contains('flipped');

        const pieces = board.querySelectorAll('.piece');
        pieces.forEach(p => {
          let sqClass = null;
          for (const cls of p.classList) {
            const m = cls.match(/^square-(\d)(\d)$/);
            if (m) {
              const file = parseInt(m[1], 10) - 1; // 0..7
              const rank = parseInt(m[2], 10) - 1; // 0..7
              let left, top;
              if (isFlipped) {
                left = (7 - file) * sqSize;
                top = rank * sqSize;
              } else {
                left = file * sqSize;
                top = (7 - rank) * sqSize;
              }
              p.style.left = left + 'px';
              p.style.top = top + 'px';
              p.style.width = sqSize + 'px';
              p.style.height = sqSize + 'px';
              break;
            }
          }
        });
      }

      function getSquareFromCoords(x, y) {
        const rect = board.getBoundingClientRect();
        const sqSize = rect.width / 8;
        const isFlipped = board.classList.contains('flipped');

        let file = Math.floor((x - rect.left) / sqSize);
        let rankIdx = Math.floor((y - rect.top) / sqSize);

        if (file < 0 || file > 7 || rankIdx < 0 || rankIdx > 7) return null;

        let rank = isFlipped ? rankIdx : (7 - rankIdx);
        if (isFlipped) file = 7 - file;

        const fileChar = String.fromCharCode(97 + file);
        const rankNum = rank + 1;
        const squareNum = `${file + 1}${rankNum}`;
        const squareName = `${fileChar}${rankNum}`;

        return { file, rank, squareNum, squareName };
      }

      function handleMove(fromSquare, toSquare) {
        if (!fromSquare || !toSquare || fromSquare.squareNum === toSquare.squareNum) return;

        // Find piece on fromSquare
        const pieces = board.querySelectorAll('.piece');
        let movingPiece = null;
        for (const p of pieces) {
          if (p.classList.contains(`square-${fromSquare.squareNum}`) || p.classList.contains(`square-${fromSquare.squareName}`)) {
            movingPiece = p;
            break;
          }
        }

        if (!movingPiece) return;

        // Remove any piece at toSquare (capture)
        for (const p of pieces) {
          if (p !== movingPiece && (p.classList.contains(`square-${toSquare.squareNum}`) || p.classList.contains(`square-${toSquare.squareName}`))) {
            p.remove();
          }
        }

        // Update classes on movingPiece
        movingPiece.classList.remove(`square-${fromSquare.squareNum}`, `square-${fromSquare.squareName}`);
        movingPiece.classList.add(`square-${toSquare.squareNum}`, `square-${toSquare.squareName}`);

        updatePiecePositions();

        // Switch active clock
        const topClock = document.getElementById('top-clock');
        const bottomClock = document.getElementById('bottom-clock');
        if (bottomClock.classList.contains('clock-player-turn')) {
          bottomClock.classList.remove('clock-player-turn');
          topClock.classList.add('clock-player-turn');
        } else {
          topClock.classList.remove('clock-player-turn');
          bottomClock.classList.add('clock-player-turn');
        }
      }

      board.addEventListener('pointerdown', (e) => {
        dragStart = getSquareFromCoords(e.clientX, e.clientY);
      });

      board.addEventListener('pointerup', (e) => {
        if (!dragStart) return;
        const dragEnd = getSquareFromCoords(e.clientX, e.clientY);
        if (dragEnd && dragStart.squareNum !== dragEnd.squareNum) {
          handleMove(dragStart, dragEnd);
        }
        dragStart = null;
      });

      board.addEventListener('mousedown', (e) => {
        if (!dragStart) dragStart = getSquareFromCoords(e.clientX, e.clientY);
      });

      board.addEventListener('mouseup', (e) => {
        if (!dragStart) return;
        const dragEnd = getSquareFromCoords(e.clientX, e.clientY);
        if (dragEnd && dragStart.squareNum !== dragEnd.squareNum) {
          handleMove(dragStart, dragEnd);
        }
        dragStart = null;
      });

      // Observe board class changes (such as 'flipped')
      const classObserver = new MutationObserver(() => {
        updatePiecePositions();
      });
      classObserver.observe(board, { attributes: true, attributeFilter: ['class', 'style'] });

      // Initial layout
      window.addEventListener('load', updatePiecePositions);
      setTimeout(updatePiecePositions, 50);

      // Expose test helper methods on window
      window.__mockChessCom = {
        handleMove,
        updatePiecePositions
      };
    })();
  </script>
</body>
</html>
